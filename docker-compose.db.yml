name: nexus-db-commerce

services:
  postgres-commerce:
    image: postgres:16-alpine
    container_name: nexus-postgres-commerce
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: commerce_db
    ports:
      - "${COMMERCE_DB_PORT:-5435}:5432"
    volumes:
      - postgres_commerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d commerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_commerce_data:
    name: nexus-local_postgres_commerce_data

networks:
  default:
    name: nexus-network
    external: true
