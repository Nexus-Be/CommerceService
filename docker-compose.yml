# =============================================================================
# NEXUS COMMERCE SERVICE - DOCKER COMPOSE
# =============================================================================
# Chạy độc lập service này. Database dùng Neon Cloud, hạ tầng dùng chung nexus-network.
# Lệnh: docker compose up -d --build
# =============================================================================

name: nexus-commerce

services:
  commerce-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-commerce-service
    ports:
      - "${COMMERCE_SERVICE_PORT:-8003}:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${COMMERCE_DB_CONNECTION:?COMMERCE_DB_CONNECTION is required}"
      WALLET_SERVICE_URL: "${WALLET_SERVICE_URL:-http://wallet-service:8008}"
      CATALOG_SERVICE_URL: "${CATALOG_SERVICE_URL:-http://catalog-service:8002}"
      FULFILLMENT_SERVICE_URL: "${FULFILLMENT_SERVICE_URL:-http://fulfillment-service:8006}"
      USER_SERVICE_URL: "${USER_SERVICE_URL:-http://user-service:8001}"
      AUCTION_SERVICE_URL: "${AUCTION_SERVICE_URL:-http://auction-service:8005}"
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://notification-service:8007}"
      Notification__Enabled: "${NOTIFICATION_ENABLED:-true}"
      # T17: the buyer refusal table approved by the project owner on 26/11/2026 (GHN reason codes: the receiver changed their mind, the receiver
      # refused for lack of money), -5 reputation points once per sub-order. Set DELIVERY_FAILURE_REFUSED_CODES to an empty value to switch it off.
      DeliveryFailure__BuyerRefusedReasonCodes: "${DELIVERY_FAILURE_REFUSED_CODES-GHN-DCD0A8,GHN-DCD1A5}"
      DeliveryFailure__BuyerRefusalScoreDelta: "${DELIVERY_FAILURE_SCORE_DELTA:--5}"
      DeliveryFailure__TableVersion: "${DELIVERY_FAILURE_TABLE_VERSION:-ghn-docs-2026-11-25}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
