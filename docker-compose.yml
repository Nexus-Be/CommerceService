# =============================================================================
# NEXUS COMMERCE SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Commerce Service:
#   CSDL chính lưu trên Neon Cloud (PostgreSQL)
#   docker compose up -d
# =============================================================================

services:

  # 1. Ứng dụng Commerce Service RESTful Web API (Port 8003)
  commerce-service:
    image: oaktree293/commerceservice
    container_name: nexus-commerce-service
    ports:
      - "${COMMERCE_SERVICE_PORT:-8003}:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${COMMERCE_CONNECTION_STRING:-${CONNECTION_STRING}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
