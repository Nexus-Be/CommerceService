# =============================================================================
# NEXUS COMMERCE SERVICE - DOCKER COMPOSE
# =============================================================================
# Chạy độc lập service này. Database dùng Neon Cloud, hạ tầng dùng chung nexus-network.
# Lệnh: docker compose up -d --build
# =============================================================================

name: nexus-commerce

services:
  commerce-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-commerce-service
    ports:
      - "${COMMERCE_SERVICE_PORT:-8003}:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${COMMERCE_DB_CONNECTION:?COMMERCE_DB_CONNECTION is required}"
      WALLET_SERVICE_URL: "${WALLET_SERVICE_URL:-http://wallet-service:8008}"
      CATALOG_SERVICE_URL: "${CATALOG_SERVICE_URL:-http://catalog-service:8002}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
