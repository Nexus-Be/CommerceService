openapi: 3.0.3
info:
  title: Commerce Service - Order Shipments Tracking API
  version: 1.0.0
  description: API contract for tracking shipments and carrier progress of master orders.
paths:
  /api/v1/orders/{orderId}/shipments:
    get:
      summary: Get Master Order Shipments Tracking (Canonical)
      description: |
        R87: Retrieves consolidated tracking progress, carrier codes, and timelines for all
        sub-orders under the specified master order.
      operationId: GetOrderShipmentTracking
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Master Order unique identifier
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Shipment tracking data successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentTrackingDto'
        '401':
          description: Unauthorized - Valid JWT Bearer token required
        '403':
          description: Forbidden - User is not the order buyer, admin, or staff
        '404':
          description: Order not found

  /api/v1/shipments/order/{orderId}:
    get:
      summary: Get Master Order Shipments Tracking (Legacy Alias)
      deprecated: true
      description: |
        Legacy route for backward compatibility with in-cluster callers.
        Callers should migrate to `/api/v1/orders/{orderId}/shipments`.
      operationId: GetLegacyShipmentTracking
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Shipment tracking data successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentTrackingDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ShipmentTrackingDto:
      type: object
      required:
        - orderId
        - orderStatus
        - createdAt
        - shipments
      properties:
        orderId:
          type: string
          format: uuid
        orderStatus:
          type: string
          example: Shipping
        createdAt:
          type: string
          format: date-time
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/SubOrderShipmentDto'

    SubOrderShipmentDto:
      type: object
      required:
        - subOrderId
        - sellerId
        - status
        - timeline
      properties:
        subOrderId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        shopName:
          type: string
        trackingCode:
          type: string
          nullable: true
          example: GHN-HCM-8829103
        shippingFee:
          type: number
          format: decimal
          example: 32000.0
        status:
          type: string
          example: Shipping
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEventDto'

    TimelineEventDto:
      type: object
      required:
        - status
        - description
        - timestamp
      properties:
        status:
          type: string
          example: Shipping
        description:
          type: string
          example: Carrier GHN picked up package.
        timestamp:
          type: string
          format: date-time
